  <style id="custom-theme-layer">
/* Premium Typography */
body, html, #root {
  font-family: 'Outfit', sans-serif !important;
}

.font-mono, .mono, .tabular-nums, 
[class*="font-mono"], [class*="tabular-nums"] {
  font-family: 'JetBrains Mono', monospace !important;
}

/* Base Body background enhancement */
body {
  background: radial-gradient(circle at 50% -20%, #1a1b26 0%, #08090B 100%) !important;
}

/* Card Hover Micro-Animations and Glows */
.rounded-\[24px\], .rounded-\[20px\], .rounded-\[18px\], .rounded-\[16px\] {
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
}

.rounded-\[24px\]:hover, .rounded-\[20px\]:hover, .rounded-\[18px\]:hover {
  transform: translateY(-4px) !important;
  box-shadow: 0 20px 40px -15px rgba(52, 211, 153, 0.15),
              0 0 20px -5px rgba(139, 92, 246, 0.1) !important;
  border-color: rgba(255, 255, 255, 0.15) !important;
}

/* Enhance existing gradients (Emerald & Violet to Cyber-Pastel) */
.from-emerald-500\/10 {
  --tw-gradient-from: rgba(45, 212, 191, 0.15) !important; /* Teal tint */
}
.text-emerald-200 {
  color: #99f6e4 !important; /* Brighter teal */
}
.text-emerald-300 {
  color: #5eead4 !important;
}

/* Floating Navigation Bar Styles */
.custom-floating-nav {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  display: flex;
  gap: 12px;
  padding: 8px 12px;
  background: rgba(18, 19, 26, 0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 99px;
  box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5),
              0 0 15px -5px rgba(255, 255, 255, 0.05);
  animation: slideUpNav 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

.custom-floating-nav a {
  text-decoration: none;
  color: rgba(255, 255, 255, 0.6);
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: 99px;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

.custom-floating-nav a:hover {
  color: white;
  background: rgba(255, 255, 255, 0.05);
}

.custom-floating-nav a.active {
  color: #08090B;
  background: white;
  box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
}

@keyframes slideUpNav {
  from { opacity: 0; transform: translate(-50%, 20px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

@keyframes customMarquee {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
/* Pause marquee on hover so users can read it */
[data-custom-marquee-added="true"]:hover {
  animation-play-state: paused !important;
}

/* Adding padding to root so nothing gets hidden behind nav */
#root {
  padding-bottom: 80px !important;
}

/* Hide header subtitle — clock already shown in the pill on the right */
header .leading-none > div:last-child {
  display: none;
}

/* Hide refresh button on mobile — data auto-refreshes */
@media (max-width: 639px) {
  button.h-8.w-8.rounded-full {
    display: none !important;
  }
}

/* Mobile: shrink title font so "Aarav's Tracker" fits fully without ellipsis */
@media (max-width: 639px) {
  header .leading-none .truncate {
    font-size: 13.5px !important;
    overflow: visible !important;
    text-overflow: clip !important;
    white-space: nowrap !important;
    letter-spacing: -0.03em !important;
  }
}

/* ── P&L Heatmap ── */
.heatmap-section {
  margin: 12px 0 0;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.02);
  backdrop-filter: blur(12px);
  padding: 14px 16px 16px;
  overflow: hidden;
}
.heatmap-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.heatmap-title {
  font-size: 13px;
  font-weight: 600;
  color: rgba(255,255,255,0.85);
  letter-spacing: 0.01em;
  display: flex;
  align-items: center;
  gap: 7px;
}
.heatmap-subtitle {
  font-size: 10px;
  color: rgba(255,255,255,0.3);
  font-family: 'JetBrains Mono', monospace;
}
.heatmap-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.heatmap-cell {
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6px 8px;
  cursor: default;
  transition: transform 0.18s ease, filter 0.18s ease;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.07);
  position: relative;
  min-width: 58px;
}
.heatmap-cell:hover {
  transform: scale(1.04);
  filter: brightness(1.2);
  z-index: 2;
  border-color: rgba(255,255,255,0.2);
}
.heatmap-ticker {
  font-size: 11px;
  font-weight: 700;
  color: rgba(255,255,255,0.92);
  letter-spacing: 0.03em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
  text-align: center;
}
.heatmap-pct {
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  margin-top: 2px;
  white-space: nowrap;
}
.heatmap-empty {
  font-size: 11px;
  color: rgba(255,255,255,0.25);
  text-align: center;
  padding: 20px 0;
  font-family: 'JetBrains Mono', monospace;
}

/* ── Bloomberg-style price flash animations ── */
@keyframes flashUp {
  0%   { background: rgba(16,185,129,0.30); color: #6ee7b7; box-shadow: 0 0 8px rgba(16,185,129,0.4); }
  70%  { background: rgba(16,185,129,0.10); }
  100% { background: transparent; }
}
@keyframes flashDown {
  0%   { background: rgba(239,68,68,0.30); color: #fca5a5; box-shadow: 0 0 8px rgba(239,68,68,0.4); }
  70%  { background: rgba(239,68,68,0.10); }
  100% { background: transparent; }
}
.price-flash-up {
  animation: flashUp 0.65s ease-out !important;
  border-radius: 3px;
}
.price-flash-down {
  animation: flashDown 0.65s ease-out !important;
  border-radius: 3px;
}

/* ── Market status box enhancements ── */
@keyframes mktGlow {
  0%, 100% { box-shadow: 0 0 0 1px rgba(16,185,129,0.18), inset 0 0 18px rgba(16,185,129,0.04); }
  50%       { box-shadow: 0 0 0 1px rgba(16,185,129,0.4),  inset 0 0 28px rgba(16,185,129,0.09); }
}
@keyframes mktSweep {
  0%   { transform: translateX(-120%); }
  100% { transform: translateX(300%); }
}
@keyframes mktBarPulse {
  0%, 100% { opacity: 0.7; }
  50%       { opacity: 1; }
}
.mkt-open {
  border-color: rgba(16,185,129,0.28) !important;
  animation: mktGlow 2.8s ease-in-out infinite, translateY(-4px) !important;
  /* keep the hover lift from the global rule */
}
.mkt-closed {
  border-color: rgba(255,190,50,0.14) !important;
}
/* Progress track at bottom of box */
.mkt-progress-track {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: rgba(255,255,255,0.05);
  border-radius: 0 0 18px 18px;
  overflow: hidden;
}
.mkt-progress-fill {
  height: 100%;
  border-radius: 0 0 18px 18px;
  background: linear-gradient(90deg, rgba(16,185,129,0.5), rgba(16,185,129,1));
  transition: width 1s linear;
  animation: mktBarPulse 2s ease-in-out infinite;
  position: relative;
}
.mkt-closed .mkt-progress-fill {
  background: linear-gradient(90deg, rgba(255,190,50,0.3), rgba(255,190,50,0.5));
  animation: none;
}
/* Shimmer sweep inside OPEN box */
.mkt-sweep {
  position: absolute;
  top: 0; bottom: 0;
  width: 25%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.055), transparent);
  animation: mktSweep 4s ease-in-out infinite;
  pointer-events: none;
}
/* LIVE badge */
.mkt-live-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: rgba(16,185,129,0.9);
  background: rgba(16,185,129,0.1);
  border: 1px solid rgba(16,185,129,0.25);
  border-radius: 99px;
  padding: 1px 6px;
  margin-left: 6px;
  vertical-align: middle;
}
.mkt-live-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(16,185,129,1);
  animation: pulseDot 1.2s infinite;
  box-shadow: 0 0 5px rgba(16,185,129,0.7);
  flex-shrink: 0;
}

/* Animated stock-chart logo */
@keyframes logoPulse {
  0%, 100% { opacity: 0.55; r: 2.2px; }
  50%       { opacity: 1;    r: 3px;   }
}
@keyframes logoGlow {
  0%, 100% { opacity: 0.25; }
  50%       { opacity: 0.6; }
}
@keyframes logoDraw {
  0%   { stroke-dashoffset: 72; }
  60%  { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 72; }
}
#aarav-logo-dot  { animation: logoPulse 1.8s ease-in-out infinite; }
#aarav-logo-glow { animation: logoDraw 4s ease-in-out infinite, logoGlow 1.8s ease-in-out infinite; }
#aarav-logo-line { animation: logoDraw 4s ease-in-out infinite; }

/* ── Seamless seam fix: margin-right replaces gap ── */
/* Row 1 (our custom marquee) */
[data-custom-marquee-added="true"] {
  gap: 0 !important;
}
[data-custom-marquee-added="true"] > * {
  margin-right: 8px !important;
  flex-shrink: 0 !important;
}
/* Row 2 (React-built animate-marquee) */
.animate-marquee {
  gap: 0 !important;
}
.animate-marquee > span {
  margin-right: 8px !important;
}

/* ── Uniform pill shape ── */
/* border-radius:9999px is a capsule, so narrow pills look circular and
   wide pills look rectangular. Fix ALL rounded-full+border pills site-wide
   to a consistent 10px so every pill looks the same regardless of content width. */
.rounded-full.border {
  border-radius: 10px !important;
}
/* Marquee pills also get fixed height + overflow clip */
[data-custom-marquee-added="true"] > *,
.animate-marquee > span {
  border-radius: 10px !important;
  height: 34px !important;
  min-height: 34px !important;
  box-sizing: border-box !important;
  white-space: nowrap !important;
  overflow: hidden !important;
}

/* ── "verifying" loading shimmer on unloaded pills ── */
@keyframes verifyPulse {
  0%, 100% { opacity: 0.25; }
  50%       { opacity: 0.7; }
}
.pill-verifying-dots {
  animation: verifyPulse 1.1s ease-in-out infinite;
  letter-spacing: 0.15em;
  font-size: 11px;
}
  
/* ── Live market-news terminal ticker ── */
#marketNewsTicker{position:sticky;top:0;left:0;right:0;height:68px;z-index:1100;display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;grid-template-rows:40px 28px;background:linear-gradient(90deg,rgba(20,8,10,.98),rgba(7,9,13,.98) 38%,rgba(7,9,13,.96));border-bottom:1px solid rgba(239,68,68,.38);box-shadow:0 5px 22px rgba(0,0,0,.34);font-family:Inter,system-ui,sans-serif;overflow:hidden}
#marketNewsTicker:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:rgba(255,255,255,.12);pointer-events:none}
#marketNewsTicker .news-badge{grid-row:1/3;height:100%;display:flex;align-items:center;gap:7px;padding:0 14px;background:linear-gradient(90deg,#991b1b,#dc2626);color:#fff;font-size:10px;font-weight:800;letter-spacing:.12em;white-space:nowrap;box-shadow:5px 0 15px rgba(0,0,0,.28);position:relative;z-index:2}
#marketNewsTicker .news-badge i{width:6px;height:6px;border-radius:50%;background:#fecaca;box-shadow:0 0 8px #fff;animation:newsLivePulse 1.2s ease-in-out infinite}
@keyframes newsLivePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.7)}}
#marketNewsTicker .news-window{min-width:0;height:40px;overflow:hidden;display:flex;align-items:center;background:linear-gradient(90deg,rgba(220,38,38,.12),transparent 65%)}
#marketNewsTicker .news-track{display:flex;align-items:center;gap:0;width:100%;height:40px;white-space:nowrap;will-change:transform}
#marketNewsTicker .news-track:hover{animation-play-state:paused}
#marketNewsTicker .news-item{display:flex;align-items:center;gap:9px;width:100%;box-sizing:border-box;padding:0 20px;color:rgba(255,255,255,.78);font-size:11px;line-height:40px;cursor:pointer;text-decoration:none;min-height:40px;overflow:hidden}
#marketNewsTicker .news-item:hover{color:#fff;background:rgba(255,255,255,.05)}
#marketNewsTicker .news-item:after{content:'◆';color:rgba(239,68,68,.72);font-size:7px;margin-left:14px}
#marketNewsTicker .news-cat{color:#5eead4;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:800;letter-spacing:.08em}
#marketNewsTicker .news-item.flash .news-cat{color:#fbbf24}
#marketNewsTicker .news-item.flash span.news-title{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(255,255,255,.9);font-weight:600;flex:1}
#marketNewsTicker .news-item.flash{animation:newsFlashIn .65s cubic-bezier(.2,.8,.2,1)}
#marketNewsTicker .news-source{color:rgba(255,255,255,.3);font-size:9px}
#marketNewsTicker .news-time{color:rgba(255,255,255,.28);font-family:'JetBrains Mono',monospace;font-size:9px}
#marketNewsTicker .news-refresh{height:40px;display:flex;align-items:center;padding:0 10px;color:rgba(255,255,255,.28);font:9px 'JetBrains Mono',monospace;white-space:nowrap;position:relative;z-index:2;background:linear-gradient(90deg,transparent,rgba(7,9,13,.96) 25%)}
#marketNewsTicker .news-refresh.is-live{color:#34d399}
#marketNewsTicker .news-quotes{grid-column:2/4;min-width:0;height:28px;overflow:hidden;border-top:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.3)}
#marketNewsTicker .quote-track{display:flex;align-items:center;width:max-content;height:28px;animation:quoteTape 32s linear infinite}
#marketNewsTicker .quote{display:inline-flex;align-items:center;gap:6px;padding:0 18px;color:#9ca3af;font:10px 'JetBrains Mono',monospace;white-space:nowrap}
#marketNewsTicker .quote strong{color:#e5e7eb;font-weight:700}
#marketNewsTicker .quote.up strong{color:#34d399}
#marketNewsTicker .quote.down strong{color:#f87171}
@keyframes newsTickerScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes newsFlashIn{0%{opacity:0;transform:translateX(42px);filter:blur(2px)}65%{opacity:1;transform:translateX(-3px);filter:blur(0)}100%{opacity:1;transform:translateX(0)}}
@keyframes quoteTape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
body{padding-top:0!important}
@media(max-width:640px){#marketNewsTicker{height:64px;grid-template-rows:38px 26px}#marketNewsTicker .news-badge{padding:0 10px;font-size:9px}#marketNewsTicker .news-window,#marketNewsTicker .news-refresh{height:38px}#marketNewsTicker .news-item{padding:0 12px;font-size:10px;line-height:38px;min-height:38px;gap:6px}#marketNewsTicker .news-item .news-source,#marketNewsTicker .news-item .news-time{display:none}#marketNewsTicker .news-refresh{display:none}#marketNewsTicker .news-quotes{grid-column:2/4;height:26px}.quote{padding:0 11px!important;font-size:9px!important}}


/* Compact live-status indicator replacing the oversized status pill */
.live-status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 2px rgba(52,211,153,.14),0 0 12px rgba(52,211,153,.85);animation:liveStatusBlink 1.25s ease-in-out infinite;flex:none}
@keyframes liveStatusBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
</style>

  <script>
    (function(){
      var START_VALUE = 200000;
      var DURATION_MS = 2600;
      function formatINR(value){
        return Math.round(value).toLocaleString("en-IN");
      }
      function readNumber(text){
        var digits = String(text || "").replace(/[^\d]/g, "");
        return digits ? Number(digits) : 0;
      }
      function findHeroAmount(){
        var labels = Array.from(document.querySelectorAll("div")).filter(function(el){
          return el.textContent.trim() === "COMBINED NET WORTH";
        });
        if (!labels.length) return null;
        var card = labels[0].parentElement;
        if (!card) return null;
        return Array.from(card.querySelectorAll(".tabular-nums")).find(function(el){
          return readNumber(el.textContent) > START_VALUE;
        }) || null;
      }
      function animateHero(){
        if (document.documentElement.dataset.netWorthIntroDone === "true") return true;
        var amount = findHeroAmount();
        if (!amount) return false;
        var target = readNumber(amount.textContent);
        if (!target || target <= START_VALUE) return false;
        document.documentElement.dataset.netWorthIntroDone = "true";
        amount.textContent = formatINR(START_VALUE);
        var started = performance.now();
        function frame(now){
          var progress = Math.min(1, (now - started) / DURATION_MS);
          var eased = 1 - Math.pow(1 - progress, 3);
          amount.textContent = formatINR(START_VALUE + (target - START_VALUE) * eased);
          if (progress < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
        return true;
      }
      function boot(){
        if (animateHero()) return;
        var attempts = 0;
        var timer = setInterval(function(){
          attempts += 1;
          if (animateHero() || attempts > 80) clearInterval(timer);
        }, 100);
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
    })();
  </script>

  <script>
    (function() {
      // Observe the body for changes since React renders dynamically
      const observer = new MutationObserver((mutations) => {
        // Find ONLY marquee/top-row pills (ignore .group cards completely)
        const items = document.querySelectorAll('.rounded-full.border');
        
        items.forEach(el => {
          // If it's the container for the top row indices, transform it into a marquee
          if (el.parentElement && el.parentElement.classList.contains('overflow-x-auto')) {
            const parent = el.parentElement;
            if (!parent.dataset.customMarqueeAdded) {
              parent.dataset.customMarqueeAdded = "true";
              
              // ── Seamless marquee setup ──
              // 1. Outer wrapper: force true overflow clip, full width
              var outer = parent.parentElement;
              if (outer) {
                outer.style.overflow = 'hidden';
                outer.style.width = '100%';
                outer.style.maxWidth = '100%';
              }

              // 2. Strip all constraints from the track
              parent.classList.remove('overflow-x-auto', 'overscroll-x-contain', 'touch-pan-x', 'scrollbar-none');
              parent.style.display = 'flex';
              parent.style.flexWrap = 'nowrap';
              parent.style.width = 'max-content';
              parent.style.maxWidth = 'none';
              parent.style.margin = '0';
              parent.style.padding = '9px 0';
              parent.style.gap = '0';           // gap handled by margin-right on children (seam fix)
              parent.style.willChange = 'transform';
              // Do NOT animate yet — wait for extra pills + sparklines + flags

              // 3. Inject extra index pills (live-fetched) before cloning
              var _extraTickers = [
                { label: 'DOW', key: '^DJI', flag: '🇺🇸' },
                { label: 'FTSE 100', key: '^FTSE', flag: '🇬🇧' },
                { label: 'NIKKEI', key: '^N225', flag: '🇯🇵' },
                { label: 'BTC', key: 'BTC-USD', flag: '' },
                { label: 'GOLD', key: 'GC=F', flag: '' }
              ];
              _extraTickers.forEach(function(t) {
                var pill = document.createElement('div');
                pill.dataset.customModsAdded = 'true';
                pill.dataset.extraPill = t.key;
                pill.dataset.ticker = t.key;
                pill.style.cssText = 'border-radius:9999px;border:1px solid rgba(255,255,255,0.1);padding:6px 14px;font-size:12px;font-family:"JetBrains Mono",monospace;display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.06);flex-shrink:0;white-space:nowrap;cursor:pointer;min-height:34px;box-sizing:border-box;';
                var dotEl = document.createElement('span');
                dotEl.style.cssText = 'width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.3);flex-shrink:0;';
                var labelEl = document.createElement('span');
                labelEl.textContent = (t.flag ? t.flag + ' ' : '') + t.label + ' ';
                var valEl = document.createElement('span');
                valEl.className = 'pill-verifying-dots';
                valEl.textContent = '···';
                pill.appendChild(dotEl);
                pill.appendChild(labelEl);
                pill.appendChild(valEl);
                pill.addEventListener('click', function() { window.open('https://finance.yahoo.com/quote/' + t.key, '_blank'); });
                parent.appendChild(pill);

                // Fetch live price for this pill
                (function(p, _dot, _val, ticker) {
                  var _urls = [
                    'https://corsproxy.io/?' + encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/' + ticker + '?interval=1d&range=2d'),
                    'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/' + ticker + '?interval=1d&range=2d')
                  ];
                  function _try(i) {
                    if (i >= _urls.length) return;
                    fetch(_urls[i]).then(function(r){ return r.json(); }).then(function(data) {
                      var meta = data && data.chart && data.chart.result && data.chart.result[0] && data.chart.result[0].meta;
                      if (!meta || !meta.regularMarketPrice) { _try(i + 1); return; }
                      var price = meta.regularMarketPrice;
                      var prev = meta.previousClose || meta.chartPreviousClose || price;
                      var pct = ((price - prev) / prev) * 100;
                      var up = pct >= 0;
                      var fmt = price >= 1000 ? price.toLocaleString('en-US', {maximumFractionDigits: 2}) : price.toFixed(2);
                      var arrow = up ? '▲' : '▼';
                      p.style.cssText = 'border-radius:9999px;border:1px solid ' + (up ? 'rgba(52,211,153,0.2)' : 'rgba(248,113,113,0.2)') + ';padding:6px 14px;font-size:12px;font-family:"JetBrains Mono",monospace;display:inline-flex;align-items:center;gap:6px;color:' + (up ? 'rgb(110,231,183)' : 'rgb(252,165,165)') + ';background:' + (up ? 'rgba(16,185,129,0.1)' : 'rgba(239,68,68,0.1)') + ';flex-shrink:0;white-space:nowrap;cursor:pointer;min-height:34px;box-sizing:border-box;';
                      _dot.style.background = up ? 'rgb(52,211,153)' : 'rgb(248,113,113)';
                      _dot.style.animation = 'pulseDot 1.6s infinite';
                      _val.className = '';
                      _val.textContent = fmt + ' ' + arrow + Math.abs(pct).toFixed(2) + '%';
                    }).catch(function(){ _try(i + 1); });
                  }
                  _try(0);
                })(pill, dotEl, valEl, t.key);
              });

              // 4. Delay clone so sparklines, flags, and extra pill prices are ready
              setTimeout(function() {
                if (parent.dataset.marqueeCloningDone) return;
                parent.dataset.marqueeCloningDone = 'true';
                // Remove any stale clones from earlier attempts
                Array.from(parent.querySelectorAll('[data-clone-pill]')).forEach(function(s){ s.remove(); });
                // Clone all pills (now with sparklines, flags, prices)
                Array.from(parent.children).forEach(function(child) {
                  var clone = child.cloneNode(true);
                  clone.dataset.customModsAdded = 'true';
                  clone.dataset.clonePill = 'true';
                  parent.appendChild(clone);
                });
                // Start animation: 35s for ~9 original pills + 5 extras
                parent.style.animation = 'customMarquee 38s linear infinite';
              }, 6000);
            }
          }

          if (!el.dataset.customModsAdded) {
            el.dataset.customModsAdded = "true";
            
            const text = el.innerText || "";
            
            // Skip USD/INR, empty, or UI elements that aren't stocks (like "SIP" or mutual fund types)
            if (text.includes('USD/INR') || text.trim() === '' || text.trim() === 'SIP' || text.trim() === 'Direct' || text.trim() === 'Regular' || text.includes('Offshore') || text.includes('Ext')) return;
            
            // Detect Country
            let isIndia = false;
            let isUS = false;
            
            if (text.startsWith('US $') || text.includes('$') || text.match(/S\&P|NASDAQ|NYSE|VTI|VXUS|SMH|ICLN|URNM|AVGE|RSP|VWO|SCHD|VDC/i)) {
              isUS = true;
            } else if (text.includes('₹') || text.match(/NIFTY|SENSEX|NSE|BSE|\.NS|\.BO|ABCAPITAL|ASHOKLEY|GANESHCP|TRANSRAILL/i)) {
              isIndia = true;
            }

            const flag = isIndia ? '🇮🇳' : (isUS ? '🇺🇸' : '');

            // 1. Add Flag (inline since they are all pills)
            if (flag) {
              const flagSpan = document.createElement('span');
              flagSpan.innerText = flag + ' ';
              flagSpan.style.marginRight = '2px';
              el.prepend(flagSpan);
            }
            
            // 2. Make it look clickable & Add listener
            // All targeted items are now pills, so they are clickable
            if (isIndia || isUS) {
              el.style.cursor = 'pointer';
              el.addEventListener('click', (e) => {
                let ticker = null;
                const words = text.split(/\s+/);
                if (words.length > 0) {
                  // extract first valid word
                  let firstWord = text.match(/\b[A-Z0-9&]{2,10}\b/);
                  if (firstWord) {
                     firstWord = firstWord[0];
                     if (firstWord === 'NIFTY') ticker = '^NSEI';
                     else if (firstWord === 'SENSEX') ticker = '^BSESN';
                     else if (firstWord === 'SP' || text.includes('S&P')) ticker = '^GSPC';
                     else if (firstWord === 'NASDAQ') ticker = '^IXIC';
                     else ticker = firstWord;
                     
                     // Auto-append .NS for Indian stocks if not an index
                     if (isIndia && ticker && !ticker.startsWith('^') && !ticker.includes('.')) {
                       ticker += '.NS';
                     }
                  }
                }
                
                if (ticker && ticker.length >= 2) {
                  el.dataset.ticker = ticker;
                  window.open(`https://finance.yahoo.com/quote/${ticker}`, '_blank');
                } else {
                  window.open('https://finance.yahoo.com', '_blank');
                }
              });
            }
          }
        });
      });

      // Start observing
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>

  <script>
    (function () {
      const POINTS = '4,27 8,20 12,25 16,12 20,20 24,8 28,17 32,6';

      function buildLogo() {

              <stop offset="0%" stop-color="#0a1f14"/>
              <stop offset="100%" stop-color="#051209"/>

          <polyline id="aarav-logo-glow" points="${POINTS}"

      function inject() {

      if (!inject()) {
        const obs = new MutationObserver(function () {
          if (inject()) obs.disconnect();
        });
        obs.observe(document.body, { childList: true, subtree: true });
      }
    })();

  <script>
    // ── Bloomberg price flash ──
    (function priceFlash() {
      function parseNum(text) {
        if (!text) return null;
        var clean = text.replace(/[^\d.\-]/g, '');
        var n = parseFloat(clean);
        return isNaN(n) ? null : n;
      }

      function looksLikePrice(text) {
        return /[₹$][\d,]|[\d,]{4,}|[\d]+\.\d+\s*%/.test(text);
      }

      function flash(el, dir) {
        if (!el || el === document.body) return;
        el.classList.remove('price-flash-up', 'price-flash-down');
        void el.offsetWidth; // reflow
        var cls = dir === 'up' ? 'price-flash-up' : 'price-flash-down';
        el.classList.add(cls);
        // Remove after animation completes so background isn't left transparent
        setTimeout(function() { el.classList.remove(cls); }, 750);
      }

      var obs = new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
          if (m.type !== 'characterData') return;
          var oldText = m.oldValue || '';
          var newText = m.target.data || '';
          if (oldText === newText) return;

          var el = m.target.parentElement;
          if (!el) return;

          // Only flash elements that look like prices
          var full = el.textContent || '';
          if (!looksLikePrice(full)) return;

          var oldNum = parseNum(oldText);
          var newNum = parseNum(newText);
          if (oldNum === null || newNum === null) return;
          if (oldNum === newNum) return;

          flash(el, newNum > oldNum ? 'up' : 'down');
        });
      });

      obs.observe(document.body, {
        subtree: true,
        characterData: true,
        characterDataOldValue: true
      });
    })();

    // ── P&L Heatmap ──
    (function plHeatmap() {
      var SECTION_ID = 'aarav-heatmap';
      var FX_APPROX = 84; // USD→INR rough rate for weight normalisation

      // Interpolate color from dailyPct  (-3 … 0 … +3%)
      function pctColor(pct) {
        var t = Math.max(-1, Math.min(1, pct / 3));
        if (t >= 0) {
          var r = Math.round(10  + (4   - 10)  * t);
          var g = Math.round(140 + (211 - 140) * t);
          var b = Math.round(80  + (153 - 80)  * t);
          var a = 0.18 + t * 0.62;
          return 'rgba(' + r + ',' + g + ',' + b + ',' + a.toFixed(2) + ')';
        } else {
          var u = -t;
          var r2 = Math.round(140 + (239 - 140) * u);
          var g2 = Math.round(60  + (68  - 60)  * u);
          var b2 = Math.round(60  + (68  - 60)  * u);
          var a2 = 0.18 + u * 0.62;
          return 'rgba(' + r2 + ',' + g2 + ',' + b2 + ',' + a2.toFixed(2) + ')';
        }
      }

      function borderColor(pct) {
        return pct >= 0
          ? 'rgba(52,211,153,' + (0.12 + Math.min(1, pct/3)*0.3) + ')'

      function pctTextColor(pct) {

      // Parse a numeric string — strips ₹ $ , + spaces
      function parseVal(s) {
        if (!s) return NaN;
        return parseFloat(s.replace(/[^\d.\-]/g, ''));
      }

      // Scrape holdings from the rendered table rows
      function scrapeHoldings() {

        if (!rows.length) return null;

        var holdings = [];
        rows.forEach(function(tr) {

          // Ticker: first sticky cell, text after the logo image/svg
          var tickerEl = cells[0];
          var ticker = (tickerEl.textContent || '').trim().replace(/\s+/g, ' ');
          // Remove leading non-word chars
          ticker = ticker.replace(/^[^A-Z0-9]+/, '').split(/\s/)[0];
          if (!ticker || ticker.length < 1) return;

          // Determine market from second cell
          var market = (cells[1].textContent || '').trim(); // "IN" or "US"

          // qty (col 3) and avg (col 4)
          var qty  = parseVal(cells[2].textContent);
          var avg  = parseVal(cells[3].textContent);
          if (isNaN(qty) || isNaN(avg) || qty <= 0 || avg <= 0) return;

          // Weight in INR terms
          var weight = qty * avg * (market === 'US' ? FX_APPROX : 1);

          // dailyPct: last cell text "+X.XX%" or "-X.XX%"
          var lastTxt = (cells[cells.length - 1].textContent || '').trim();
          var pctMatch = lastTxt.match(/([+\-]?\d+\.?\d*)\s*%/);
          if (!pctMatch) return;
          var dailyPct = parseFloat(pctMatch[1]);
          if (isNaN(dailyPct)) return;

          holdings.push({ ticker: ticker, weight: weight, pct: dailyPct, market: market });
        });

        return holdings.length ? holdings : null;
      }

      function buildHeatmap(holdings) {
        // Sort by weight desc
        holdings.sort(function(a, b) { return b.weight - a.weight; });

        var totalWeight = holdings.reduce(function(s, h) { return s + h.weight; }, 0);

        // Assign flex-grow proportional to sqrt(weight_share) — looks better visually
        var cells = holdings.map(function(h) {
          var share = h.weight / totalWeight;          // 0..1
          var grow  = Math.max(1, Math.round(Math.sqrt(share) * 18));
          var minH  = 54 + Math.round(share * 160);   // 54–80px height
          var bg    = pctColor(h.pct);
          var border= borderColor(h.pct);
          var txtCol= pctTextColor(h.pct);
          var sign  = h.pct >= 0 ? '+' : '';
          var flag  = h.market === 'US' ? '🇺🇸' : '🇮🇳';

          return '<div class="heatmap-cell" style="flex:' + grow + ';min-height:' + minH + 'px;background:' + bg + ';border-color:' + border + '">' +
            '<span class="heatmap-ticker">' + flag + ' ' + h.ticker + '</span>' +
            '<span class="heatmap-pct" style="color:' + txtCol + '">' + sign + h.pct.toFixed(2) + '%</span>' +
            '</div>';
        }).join('');

        return cells;
      }

      function render() {
        var holdings = scrapeHoldings();
        var section = document.getElementById(SECTION_ID);

        if (!holdings) {
          // No data yet — section stays hidden
          return false;
        }

        var cellsHTML = buildHeatmap(holdings);

        // Find insertion point: the col-span-12 grid wrapping Holdings
        if (!section) {
          // Find the Holdings h3 → walk up to the grid container
          var h3 = null;
          document.querySelectorAll('h3').forEach(function(el) {
            if (el.textContent.trim() === 'Holdings') h3 = el;

          if (!gridContainer) return false;

          section = document.createElement('div');
          section.id = SECTION_ID;
          section.className = 'heatmap-section';

        section.innerHTML =
          '<div class="heatmap-header">' +
            '<span class="heatmap-title">' +
              '<svg width="13" height="13" viewBox="0 0 13 13" fill="none">' +
                '<rect x="0" y="7" width="3" height="6" rx="1" fill="rgba(52,211,153,0.8)"/>' +
                '<rect x="4" y="4" width="3" height="9" rx="1" fill="rgba(52,211,153,0.6)"/>' +
                '<rect x="8" y="1" width="3" height="12" rx="1" fill="rgba(52,211,153,0.9)"/>' +
                '<rect x="1" y="0" width="11" height="1.5" rx="0.75" fill="rgba(255,255,255,0.15)"/>' +
              '</svg>' +

            '</span>' +
            '<span class="heatmap-subtitle">sized by position &bull; live</span>' +

    // ── Mini sparkline charts inside ticker pills ──
    (function sparklines() {
      var cache = {};
      var inFlight = {};

      async function fetchPoints(ticker) {
        if (cache[ticker]) return cache[ticker];
        if (inFlight[ticker]) return null;
        inFlight[ticker] = true;
        var base = 'https://query1.finance.yahoo.com/v8/finance/chart/' +
                   encodeURIComponent(ticker) + '?interval=1d&range=8d';
        var proxies = [
          'https://corsproxy.io/?' + encodeURIComponent(base),
          'https://api.allorigins.win/raw?url=' + encodeURIComponent(base),
          base
        ];
        for (var i = 0; i < proxies.length; i++) {
          try {
            var r = await fetch(proxies[i], { cache: 'no-store' });
            if (!r.ok) continue;
            var j = await r.json();
            var closes = j && j.chart && j.chart.result && j.chart.result[0] &&
                         j.chart.result[0].indicators &&
                         j.chart.result[0].indicators.quote &&
                         j.chart.result[0].indicators.quote[0] &&
                         j.chart.result[0].indicators.quote[0].close;
            if (closes && closes.length >= 2) {
              var valid = closes.filter(function(v) { return v != null; });
              if (valid.length >= 2) {
                cache[ticker] = valid;
                delete inFlight[ticker];
                return valid;
              }
            }
          } catch(e) {}
        }
        delete inFlight[ticker];
        cache[ticker] = null; // mark as failed so we don't retry forever
        return null;
      }

      function buildSVG(pts, isUp) {
        var W = 54, H = 22;
        var lo = Math.min.apply(null, pts);
        var hi = Math.max.apply(null, pts);
        var span = hi - lo || 1;
        var pad = 2;
        var coords = pts.map(function(v, i) {
          var x = ((i / (pts.length - 1)) * (W - pad * 2) + pad).toFixed(1);
          var y = (H - pad - ((v - lo) / span) * (H - pad * 2)).toFixed(1);
          return x + ',' + y;
        }).join(' ');

        var stroke = isUp ? '#34d399' : '#f87171';
        var glow   = isUp ? 'rgba(52,211,153,0.18)' : 'rgba(248,113,113,0.18)';
        // area fill path: line + down to bottom-right + bottom-left
        var pts0   = pts.map(function(v, i) {
          var x = ((i / (pts.length - 1)) * (W - pad * 2) + pad).toFixed(1);
          var y = (H - pad - ((v - lo) / span) * (H - pad * 2)).toFixed(1);
          return x + ',' + y;
        });
        var lastX  = ((1) * (W - pad * 2) + pad).toFixed(1);
        var firstX = pad.toFixed(1);
        var areaD  = 'M ' + pts0.join(' L ') +
                     ' L ' + lastX + ',' + (H - pad) +
                     ' L ' + firstX + ',' + (H - pad) + ' Z';

        return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H +
               '" fill="none" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="' + areaD + '" fill="' + glow + '"/>' +
          '<polyline points="' + coords + '" stroke="' + stroke +
          '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
          '</svg>';
      }

      async function processPill(el) {
        if (el.dataset.sparklineDone) return;
        var ticker = el.dataset.ticker;
        if (!ticker) return;
        el.dataset.sparklineDone = 'pending';

        var pts = await fetchPoints(ticker);
        if (!pts || pts.length < 2) {
          el.dataset.sparklineDone = 'failed';
          return;
        }

        var isUp = pts[pts.length - 1] >= pts[0];
        var wrap = document.createElement('span');
        wrap.setAttribute('aria-hidden', 'true');
        wrap.style.cssText = 'display:inline-flex;align-items:center;margin-left:5px;opacity:0.9;flex-shrink:0;';
        wrap.innerHTML = buildSVG(pts, isUp);
        el.appendChild(wrap);
        el.dataset.sparklineDone = 'true';
      }

      function scan() {
        document.querySelectorAll('[data-ticker]').forEach(function(el) {
          if (!el.dataset.sparklineDone) processPill(el);
        });
      }

      // Give the existing ticker-assignment observer a head start, then scan
      setTimeout(scan, 1800);
      setInterval(scan, 4000);
    })();

          // ── Session progress bar ──

      inject();

  <script>
    /* ── CountUp: animate old→new numeric values ── */
    (function(){
      'use strict';
      var _anim = new WeakSet();

      function parse(s) {
        if (!s) return null;
        // Match: optional sign + optional currency symbol + number-with-commas + optional suffix
        var m = s.match(/^([+\-]?\s*[₹$€£¥]?\s*)([\d,]+(?:\.\d+)?)(.*)$/);
        if (!m) return null;
        var before = m[1], numStr = m[2], after = m[3];
        var clean = numStr.replace(/,/g, '');
        var val = parseFloat(clean);
        if (isNaN(val)) return null;
        var dec = (numStr.split('.')[1] || '').length;
        // Indian fmt: 1,23,456 — second group from right is 2-digit
        var indian = /\d,\d{2},/.test(numStr) || /^\d{1,2}(,\d{2})+$/.test(numStr);
        return { before: before, after: after, val: val, dec: dec, indian: indian };
      }

      function fmtInt(intStr, indian) {
        if (indian) {
          if (intStr.length <= 3) return intStr;
          var last3 = intStr.slice(-3);
          var rest  = intStr.slice(0, -3);
          return rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3;
        }
        return intStr.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      }

      function fmt(val, p) {
        var abs   = Math.abs(val).toFixed(p.dec);
        var parts = abs.split('.');
        var sign  = (p.before.indexOf('-') !== -1) ? '-' : (p.before.indexOf('+') !== -1 ? '+' : '');
        var cur   = p.before.replace(/[+\-]/g, '');
        var num   = fmtInt(parts[0], p.indian) + (parts[1] !== undefined ? '.' + parts[1] : '');
        return sign + cur + num + p.after;
      }

      var _obs;
      var _cfg = { subtree: true, characterData: true, characterDataOldValue: true };

      function countUp(node, from, to, info) {
        _anim.add(node);
        var dur = 420;
        var t0  = performance.now();
        (function tick(now) {
          var p  = Math.min((now - t0) / dur, 1);
          var e  = 1 - Math.pow(1 - p, 3);   // ease-out cubic
          var cur = from + (to - from) * e;
          _obs.disconnect();
          node.textContent = fmt(cur, info);
          _obs.observe(document.body, _cfg);
          if (p < 1) requestAnimationFrame(tick);
          else        _anim.delete(node);
        })(performance.now());
      }

      _obs = new MutationObserver(function(muts) {
        for (var i = 0; i < muts.length; i++) {
          var m  = muts[i];
          var nd = m.target;
          if (_anim.has(nd)) continue;
          var oldS = m.oldValue   || '';
          var newS = nd.textContent || '';
          if (oldS === newS) continue;
          var op = parse(oldS);
          var np = parse(newS);
          if (!op || !np) continue;
          if (Math.abs(np.val - op.val) < 0.001) continue;
          // Only animate when the surrounding label/symbol is unchanged
          if (op.before !== np.before || op.after !== np.after) continue;
          countUp(nd, op.val, np.val, np);
        }
      });

      _obs.observe(document.body, _cfg);
    })();
  </script>

      function parse(items,cat,maxAgeHours){

      /* Direct RSS-to-JSON API: no browser XML parsing or multi-proxy delay. */
      async function get(url){
        var api='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url)+'&_='+Date.now();
        var controller=new AbortController(),timer=setTimeout(function(){controller.abort()},8000);
        try{
          var r=await fetch(api,{cache:'no-store',signal:controller.signal});
          if(!r.ok) throw Error('HTTP '+r.status);
          var data=await r.json();
          if(data.status&&data.status!=='ok') throw Error(data.message||'feed unavailable');
          return data.items||[];
        }finally{clearTimeout(timer)}
      }
      function render(items){
        var isFallback=!items.length;
        if(isFallback) items=fallback;
        flashItems=items.slice();
        flashIndex=0;
        clearInterval(fallbackTimer);
        function flashTitle(title){
          var t=String(title||'').replace(/\s+/g,' ').trim();
          /* Drop the syndicated source suffix first; the source is shown separately. */
          t=t.replace(/\s+[-|–—]\s+[^-|–—]{2,40}$/,'').trim();
          var limit=window.innerWidth<=640?54:92;
          return t.length>limit?t.slice(0,limit-1).trim()+'…':t;
        }
        function showFlash(){
          var n=flashItems[flashIndex%flashItems.length];
          track.innerHTML='<a class="news-item flash" href="'+esc(n.link||'#')+'" '+(n.link&&n.link!=='#'?'target="_blank" rel="noopener noreferrer"':'onclick="return false"')+'><b class="news-cat">'+esc(n.cat)+'</b><span class="news-title">'+esc(flashTitle(n.title))+'</span><small class="news-source">'+esc(n.source)+'</small><small class="news-time">'+(n.date?esc(ago(n.date)):'LIVE')+'</small></a>';
          flashIndex++;
        }
        showFlash();
        if(flashItems.length>1) fallbackTimer=setInterval(showFlash,6500);
      }
      async function refresh(){
        status.textContent='UPDATING'; status.classList.remove('is-live');
        var all=[],seen={};
        await Promise.all(feeds.map(async function(f){try{
          var raw=await get(f.url),got=parse(raw,f.cat,3);
          /* If no very recent story exists, keep real current-session headlines up to 12h old. */
          if(!got.length) got=parse(raw,f.cat,12);
          /* Last-resort real headlines: a delayed RSS bridge is better than a blank ticker. */
          if(!got.length) got=parse(raw,f.cat,24*365);
          got.forEach(function(n){var k=n.title.toLowerCase();if(!seen[k]){seen[k]=1;all.push(n)}});
        }catch(e){}}));
        render(all.length?all:fallback);
        status.textContent=all.length?'LIVE • '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'SCANNING';
        if(all.length) status.classList.add('is-live'); else setTimeout(refresh,10000);
      }
      render(fallback); refresh(); setInterval(refresh,60000);
    })();
  </script>
</body>
